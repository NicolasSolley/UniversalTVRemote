# Builds the UniversalTVRemote iOS app unsigned and packages an IPA for
# LiveContainer. LiveContainer runs unsigned guest IPAs inside its own
# signed host process, so no Apple Developer account, provisioning profile,
# or signing step is needed. `xcodebuild build` (NOT `archive`) is used
# because archiving fails for unsigned builds.
#
# Outputs:
# - Every push / PR: the IPA is uploaded as a workflow artifact.
# - Every v* tag push: the IPA is also attached to a GitHub Release, so it
#   can be downloaded directly on the iPhone and opened in LiveContainer.
name: Build unsigned IPA

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version

      - name: Build (unsigned)
        run: |
          xcodebuild build \
            -project UniversalTVRemote.xcodeproj \
            -scheme UniversalTVRemote \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO

      - name: Package unsigned IPA
        run: |
          APP_PATH=$(ls -d build/DerivedData/Build/Products/Release-iphoneos/*.app | head -n 1)
          echo "App bundle: $APP_PATH"
          rm -rf Payload UniversalTVRemote-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload UniversalTVRemote-unsigned.ipa
          ls -lh UniversalTVRemote-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniversalTVRemote-unsigned
          path: UniversalTVRemote-unsigned.ipa
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: UniversalTVRemote-unsigned.ipa
          generate_release_notes: true
